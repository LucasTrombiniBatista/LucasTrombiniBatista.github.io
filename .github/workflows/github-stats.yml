name: GitHub stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Sem actions de terceiros: clone direto com o token efêmero do próprio workflow.
      - name: Clonar repositório
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Buscar contribuições
        working-directory: repo
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/fetch-github-stats.mjs

      - name: Commitar se mudou
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git diff --cached --quiet || { git commit -m "chore: atualiza estatísticas do GitHub" && git push; }
